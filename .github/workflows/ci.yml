name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: keep go.mod/go.sum consistent
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Not formatted:"
            echo "$files"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v6
        with:
          # Pinned version instead of "latest", so a golangci-lint upgrade
          # (e.g. to v2 with a new config format) does not silently change
          # CI results.
          version: v1.64.2
      - run: docker compose config
      - run: docker build -t zimacube-fan-controller:test .
