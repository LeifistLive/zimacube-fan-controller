name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          # Kein go.sum vorhanden (keine Abhaengigkeiten), also nichts zu
          # cachen; siehe go-mod-tidy-Schritt unten, der das erzwingt, sobald
          # sich das aendert.
          cache: false
      - name: go.mod/go.sum konsistent halten
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Nicht formatiert:"
            echo "$files"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v6
        with:
          # Feste Version statt "latest", damit ein golangci-lint-Upgrade
          # (z. B. auf v2 mit neuem Config-Format) nicht unbemerkt die
          # CI-Ergebnisse aendert.
          version: v1.64.2
      - run: docker compose config
      - run: docker build -t zimacube-fan-controller:test .
