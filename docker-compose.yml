services:
  zimacube-fan-controller:
    build:
      context: .
      args:
        # Leer lassen: das Dockerfile faellt dann auf die VERSION-Datei im
        # Repo zurueck. Nur setzen, um eine andere Versionsnummer zu erzwingen.
        VERSION: "${VERSION:-}"

    image: zimacube-fan-controller:local
    container_name: zimacube-fan-controller
    restart: unless-stopped

    # ApplySafeState braucht bis zu ~10s fuer den I2C-Schreibversuch beim
    # Beenden; Dockers Default (10s) liesse dafuer kaum Luft.
    stop_grace_period: 20s

    devices:
      # Busnummer und I2C_BUS muessen zusammenpassen, daher dieselbe Variable.
      - "/dev/i2c-${I2C_BUS:-0}:/dev/i2c-${I2C_BUS:-0}:rwm"

    volumes:
      # Das ganze Verzeichnis einbinden, nicht einzelne Dateien: emhttp
      # schreibt var.ini und disks.ini neu, ein Single-File-Mount zeigt danach
      # dauerhaft auf den alten Inode und die Temperaturen frieren ein.
      - /var/local/emhttp:/var/local/emhttp:ro
      - fan-data:/data

    environment:
      TZ: "${TZ:-Europe/Berlin}"
      I2C_BUS: "${I2C_BUS:-0}"
      I2C_ADDRESS: "${I2C_ADDRESS:-0x69}"
      I2C_TIMEOUT_SECONDS: "${I2C_TIMEOUT_SECONDS:-5}"
      I2C_RETRIES: "${I2C_RETRIES:-3}"

      CHECK_INTERVAL_SECONDS: "${CHECK_INTERVAL_SECONDS:-15}"
      HISTORY_INTERVAL_SECONDS: "${HISTORY_INTERVAL_SECONDS:-300}"
      DETECT_INTERVAL_SECONDS: "${DETECT_INTERVAL_SECONDS:-300}"

      # Schreibt die aktuelle PWM auch ohne Wertaenderung erneut, damit ein
      # Reset des Backplane-Controllers nicht dauerhaft unbemerkt bleibt.
      REAPPLY_INTERVAL_SECONDS: "${REAPPLY_INTERVAL_SECONDS:-300}"

      # Obergrenze fuer history.jsonl und events.jsonl (Zeilen je Datei).
      MAX_LOG_LINES: "${MAX_LOG_LINES:-20000}"

      # Drehzahl, die beim Beenden gesetzt wird. 0 laesst den letzten Wert stehen.
      SAFE_SHUTDOWN_PERCENT: "${SAFE_SHUTDOWN_PERCENT:-0}"

      LISTEN_ADDRESS: "0.0.0.0:8080"

      # Ohne ADMIN_PASSWORD ist der Login deaktiviert und das gesamte
      # Dashboard offen erreichbar - unbedingt setzen, sobald es im LAN
      # erreichbar ist. Wird auch von fanctl (docker exec) zum Einloggen
      # verwendet.
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"

    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8086}:8080"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=2m,nosuid,nodev,noexec

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fan-data:
