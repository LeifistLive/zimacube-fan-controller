services:
  zimacube-fan-controller:
    build: .

    container_name: zimacube-fan-controller

    restart: unless-stopped

    network_mode: none

    devices:
      - /dev/i2c-0:/dev/i2c-0

    security_opt:
      - no-new-privileges:true

    cap_add:
      - SYS_RAWIO

    environment:
      FAN_PWM_HEX: "0x5a"