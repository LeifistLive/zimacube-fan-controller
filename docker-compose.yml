services:
  zimacube-fan-controller:
    # Pulls the prebuilt multi-arch image CI publishes on every push to main
    # and on version tags (see .github/workflows/ghcr.yml), instead of
    # building from source - faster deploys, and Portainer's "Re-pull image"
    # actually does something. To build locally instead (e.g. after changing
    # the code), replace this with a `build: context: .` block - see
    # docs/INSTALL.md.
    image: ghcr.io/leifistlive/zimacube-fan-controller:latest
    container_name: zimacube-fan-controller
    restart: unless-stopped

    # ApplySafeState needs up to ~10s for the I2C write attempt on
    # shutdown; Docker's default (10s) would leave barely any room for that.
    stop_grace_period: 20s

    devices:
      # The bus number and I2C_BUS must match, hence the same variable.
      - "/dev/i2c-${I2C_BUS:-0}:/dev/i2c-${I2C_BUS:-0}:rwm"

    volumes:
      # Mount the whole directory, not individual files: emhttp rewrites
      # var.ini and disks.ini, and a single-file mount would then keep
      # pointing at the old inode forever, freezing the temperatures.
      - /var/local/emhttp:/var/local/emhttp:ro
      # Deliberately a named Docker volume (on Unraid this lives on the
      # Docker data store, usually cache/boot) instead of a bind mount to
      # /mnt/user/... : config.json/override.json/history.jsonl/events.jsonl
      # are written regularly (history every HISTORY_INTERVAL_SECONDS,
      # default 5 min). On an array disk this would periodically wake a
      # disk that is in standby. Do not redirect this to an array disk.
      - fan-data:/data

    environment:
      TZ: "${TZ:-Europe/Berlin}"
      I2C_BUS: "${I2C_BUS:-0}"
      I2C_ADDRESS: "${I2C_ADDRESS:-0x69}"
      I2C_TIMEOUT_SECONDS: "${I2C_TIMEOUT_SECONDS:-5}"
      I2C_RETRIES: "${I2C_RETRIES:-3}"

      CHECK_INTERVAL_SECONDS: "${CHECK_INTERVAL_SECONDS:-15}"
      HISTORY_INTERVAL_SECONDS: "${HISTORY_INTERVAL_SECONDS:-300}"
      DETECT_INTERVAL_SECONDS: "${DETECT_INTERVAL_SECONDS:-300}"

      # Rewrites the current PWM even without a value change, so a reset of
      # the backplane controller does not go permanently unnoticed.
      REAPPLY_INTERVAL_SECONDS: "${REAPPLY_INTERVAL_SECONDS:-300}"

      # Upper bound for history.jsonl and events.jsonl (lines per file).
      MAX_LOG_LINES: "${MAX_LOG_LINES:-20000}"

      # Speed set on shutdown. 0 leaves the last value in place.
      SAFE_SHUTDOWN_PERCENT: "${SAFE_SHUTDOWN_PERCENT:-0}"

      LISTEN_ADDRESS: "0.0.0.0:8080"

      # Without ADMIN_PASSWORD the login is disabled and the whole
      # dashboard is openly reachable - be sure to set this once it is
      # reachable on the LAN. Also used by fanctl (docker exec) to log in.
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"

    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8086}:8080"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=2m,nosuid,nodev,noexec

    # Fully overrides the HEALTHCHECK from the Dockerfile (this is
    # intentional: Compose deployments may adjust the values here without
    # rebuilding the image). Keep both places in sync when changing this.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fan-data:
